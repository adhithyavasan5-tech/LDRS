# ─── LDRS Production Nginx Configuration Template ──────────────────────────
# Place this file at /etc/nginx/sites-available/ldrs.conf and symlink to sites-enabled.

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect HTTP to HTTPS (uncomment when SSL certificate is configured)
    # return 301 https://$host$request_uri;

    # Maximum file upload size for 2GB video uploads
    client_max_body_size 2000M;

    # Timeout settings for handling large file uploads and long-lived websockets
    client_body_timeout 900s;
    client_header_timeout 900s;
    keepalive_timeout 900s;
    send_timeout 900s;

    # Serve static frontend SPA build files
    location / {
        root /var/www/ldrs/client/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        }
    }

    # Reverse proxy for Express REST API
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;

        # Pass original request headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for large video upload processing
        proxy_connect_timeout 900s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;

        # Disable buffering for large uploads/streaming
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Reverse proxy for Socket.io WebSocket connections
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;

        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for active Socket.io connections
        proxy_connect_timeout 900s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }
}
